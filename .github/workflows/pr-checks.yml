# .github/workflows/pr-checks.yml
name: PR Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    # invoke manually

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build clang-tidy cppcheck

      - name: Run checks
        run: ./.ci/run
