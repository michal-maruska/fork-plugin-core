# .github/workflows/pr-checks.yml
name: PR Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    # invoke manually

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      # this is what we build for: SID
      image:  ghcr.io/${{ github.repository_owner }}/debian-builder:main
      # for now the image is not public ...
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install TEST dependencies
        # inside the container, no "sudo"!
        run: |
          apt-get update
          apt-get install -y \
               cmake ninja-build \
               clang clang-tidy \
               cppcheck \
               googletest libgtest-dev libgmock-dev

      - name: Install dependencies
        run: |
          apt-get update
          # 3. Install build-deps (this still needs root)
          mk-build-deps --install --remove --tool="apt-get -y --no-install-recommends" debian/control

      # inside docker: the checkout was done outside as root!
      - name: fix permissions
        run: |
          chown --recursive builder:builder ../

      - name: Run checks
        run: |
          su builder -c "./.ci/run"
